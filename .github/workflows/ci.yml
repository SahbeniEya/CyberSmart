# .github/workflows/ci.yml
# CI/CD pipeline for the CyberSmart platform
# Triggers on push, PR, or manual dispatch from the DevOps dashboard

name: CyberSmart CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend/backend
          pip install -r requirements.txt
          pip install sqlalchemy pytest httpx
      - name: Lint
        run: |
          pip install flake8
          cd backend/backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Verify app loads
        run: |
          cd backend/backend
          python -c "from main import app; print(f'✅ App loaded — {len(app.routes)} routes')"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & Build
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Verify build
        run: ls -la frontend/dist/

  security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit
        run: |
          pip install pip-audit
          cd backend/backend
          pip-audit -r requirements.txt || true
      - name: npm dependency audit
        run: |
          cd frontend
          npm audit --audit-level=high || true